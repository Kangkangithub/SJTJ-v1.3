services:
  app:
    build: .
    image: shennong-ai:latest
    container_name: shennong-ai
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      # .env 里是 development，容器内强制为 production
      - NODE_ENV=production
    volumes:
      # 直接使用项目内现有数据，保留用户、对话历史和向量缓存
      - ./backend/data:/app/backend/data
      # 直接使用项目内现有图片/视频资源
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
