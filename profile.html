<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 神农AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/herb-app.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/profile.css">
</head>
<body class="profile-page">
    <a class="skip-link" href="#mainContent">跳到主内容</a>
    <div class="profile-shell">
        <header class="profile-account-header">
            <a class="profile-brand" href="index.html">
                <span class="profile-brand-name">神农AI</span>
                <span class="profile-brand-subtitle">中药药材知识图谱系统</span>
            </a>
            <div class="profile-header-actions">
                <a class="btn secondary" href="index.html">返回首页</a>
                <button type="button" id="logoutBtn" class="btn danger-secondary">退出登录</button>
            </div>
        </header>

        <main id="mainContent" class="profile-main" aria-labelledby="profileTitle">
            <div class="profile-title-row">
                <div>
                    <h1 id="profileTitle">个人中心</h1>
                    <p>管理账户资料和安全设置。</p>
                </div>
                <div id="profileMessage" class="profile-message" role="status" aria-live="polite"></div>
            </div>

            <div class="profile-layout">
                <aside class="profile-summary card" aria-label="账户摘要">
                    <button type="button" id="avatarButton" class="avatar-button" aria-label="选择头像预览">
                        <span id="avatarInitial" class="avatar-initial"></span>
                        <img id="avatarImage" class="avatar-image" alt="" hidden>
                    </button>
                    <input type="file" id="avatarInput" accept="image/*" hidden>
                    <p id="avatarHint" class="avatar-hint">可选择头像预览。</p>
                    <h2 id="summaryName">正在读取资料</h2>
                    <p id="summaryEmail"></p>
                    <dl class="profile-facts">
                        <div>
                            <dt>账号状态</dt>
                            <dd id="summaryStatus">-</dd>
                        </div>
                        <div>
                            <dt>角色</dt>
                            <dd id="summaryRole">-</dd>
                        </div>
                    </dl>
                </aside>

                <section class="profile-form-panel card" aria-label="资料表单">
                    <form id="profileForm">
                        <section class="form-section" aria-labelledby="basicInfoTitle">
                            <h2 id="basicInfoTitle">基本信息</h2>
                            <div class="profile-form-grid">
                                <div class="form-group">
                                    <label for="username">用户名</label>
                                    <input type="text" id="username" name="username" readonly>
                                </div>
                                <div class="form-group">
                                    <label for="email">电子邮箱</label>
                                    <input type="email" id="email" name="email" readonly>
                                </div>
                                <div class="form-group">
                                    <label for="displayName">显示名称</label>
                                    <input type="text" id="displayName" name="displayName" placeholder="请输入显示名称">
                                </div>
                                <div class="form-group">
                                    <label for="phone">手机号</label>
                                    <input type="tel" id="phone" name="phone" placeholder="请输入手机号" autocomplete="tel">
                                </div>
                            </div>
                        </section>

                        <section class="form-section" aria-labelledby="bioTitle">
                            <h2 id="bioTitle">个人简介</h2>
                            <div class="form-group">
                                <label for="bio">简介</label>
                                <textarea id="bio" name="bio" rows="5" placeholder="写一点你的学习方向或关注的药材"></textarea>
                            </div>
                        </section>

                        <div class="profile-form-actions">
                            <button type="submit" id="saveProfileBtn" class="btn btn-primary" disabled>保存修改</button>
                            <button type="button" id="resetProfileBtn" class="btn secondary" disabled>重置</button>
                            <button type="button" id="openPasswordBtn" class="btn ghost" disabled>修改密码</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <div id="passwordModal" class="profile-modal" hidden>
        <div class="profile-modal-backdrop" data-close-password></div>
        <section class="profile-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
            <div class="profile-modal-header">
                <h2 id="passwordTitle">修改密码</h2>
                <button type="button" class="modal-close" data-close-password aria-label="关闭修改密码">×</button>
            </div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">确认新密码</label>
                    <input type="password" id="confirmNewPassword" autocomplete="new-password" required>
                </div>
                <div id="passwordMessage" class="profile-message" role="status" aria-live="polite"></div>
                <div class="profile-form-actions modal-actions">
                    <button type="submit" id="savePasswordBtn" class="btn btn-primary">保存密码</button>
                    <button type="button" class="btn secondary" data-close-password>取消</button>
                </div>
            </form>
        </section>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        const profileForm = document.getElementById('profileForm');
        const passwordForm = document.getElementById('passwordForm');
        const profileMessage = document.getElementById('profileMessage');
        const passwordMessage = document.getElementById('passwordMessage');
        const passwordModal = document.getElementById('passwordModal');
        let lastProfile = null;

        document.addEventListener('DOMContentLoaded', loadProfile);
        profileForm.addEventListener('submit', saveProfile);
        passwordForm.addEventListener('submit', changePassword);
        document.getElementById('resetProfileBtn').addEventListener('click', function() {
            if (!lastProfile) {
                showProfileMessage('资料尚未读取，请稍后重试。', 'error');
                return;
            }
            fillProfile(lastProfile);
            showProfileMessage('已恢复到最近一次读取的资料。', 'success');
        });
        document.getElementById('openPasswordBtn').addEventListener('click', openPasswordModal);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('avatarButton').addEventListener('click', function() {
            document.getElementById('avatarInput').click();
        });
        document.getElementById('avatarInput').addEventListener('change', previewAvatar);
        document.querySelectorAll('[data-close-password]').forEach(function(node) {
            node.addEventListener('click', closePasswordModal);
        });

        async function loadProfile() {
            const authToken = getAuthToken();
            if (!authToken) {
                window.location.href = 'login.html';
                return;
            }

            try {
                showProfileMessage('正在读取资料。', '');
                const response = await fetch(`${API_BASE}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json().catch(() => ({}));

                if (response.status === 401 || response.status === 403) {
                    handleUnauthorized();
                    return;
                }

                if (!response.ok || !data.success || !data.data) {
                    throw new Error(data.message || '资料读取失败，请稍后重试。');
                }

                lastProfile = data.data;
                fillProfile(lastProfile);
                setProfileFormEnabled(true);
                localStorage.setItem('userInfo', JSON.stringify({ ...lastProfile, isLoggedIn: true }));
                showProfileMessage('', '');
            } catch (error) {
                showProfileMessage(error.message || '资料读取失败，请稍后重试。', 'error');
            }
        }

        async function saveProfile(event) {
            event.preventDefault();
            const authToken = getAuthToken();
            if (!authToken) {
                window.location.href = 'login.html';
                return;
            }

            const saveBtn = document.getElementById('saveProfileBtn');
            const originalText = saveBtn.textContent;
            const payload = {
                name: document.getElementById('displayName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                bio: document.getElementById('bio').value.trim()
            };

            try {
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中';
                showProfileMessage('', '');

                const response = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));

                if (response.status === 401 || response.status === 403) {
                    handleUnauthorized();
                    return;
                }

                if (!response.ok || !data.success || !data.data) {
                    throw new Error(data.message || '保存失败，请稍后重试。');
                }

                lastProfile = data.data;
                fillProfile(lastProfile);
                localStorage.setItem('userInfo', JSON.stringify({ ...lastProfile, isLoggedIn: true }));
                showProfileMessage('资料已保存。', 'success');
            } catch (error) {
                showProfileMessage(error.message || '保存失败，请稍后重试。', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        }

        async function changePassword(event) {
            event.preventDefault();
            const authToken = getAuthToken();
            if (!authToken) {
                closePasswordModal();
                window.location.href = 'login.html';
                return;
            }

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const saveBtn = document.getElementById('savePasswordBtn');
            const originalText = saveBtn.textContent;

            if (newPassword !== confirmNewPassword) {
                showPasswordMessage('两次输入的新密码不一致。', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showPasswordMessage('新密码至少需要 6 个字符。', 'error');
                return;
            }

            try {
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中';
                showPasswordMessage('', '');

                const response = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await response.json().catch(() => ({}));

                if (response.status === 401 || response.status === 403) {
                    handleUnauthorized();
                    return;
                }

                if (!response.ok || data.success === false) {
                    throw new Error(data.message || '密码修改失败，请稍后重试。');
                }

                showPasswordMessage('密码已修改。', 'success');
                passwordForm.reset();
                setTimeout(closePasswordModal, 700);
            } catch (error) {
                showPasswordMessage(error.message || '密码修改失败，请稍后重试。', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        }

        function fillProfile(user) {
            const displayName = user.name || user.username || '';
            document.getElementById('summaryName').textContent = displayName || '未填写名称';
            document.getElementById('summaryEmail').textContent = user.email || '';
            document.getElementById('summaryStatus').textContent = normalizeStatus(user.status);
            document.getElementById('summaryRole').textContent = normalizeRole(user.role);
            document.getElementById('username').value = user.username || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('displayName').value = user.name || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('bio').value = user.bio || '';
            renderAvatar(user.avatar, displayName || user.email || '');
        }

        function setProfileFormEnabled(enabled) {
            document.getElementById('saveProfileBtn').disabled = !enabled;
            document.getElementById('resetProfileBtn').disabled = !enabled;
            document.getElementById('openPasswordBtn').disabled = !enabled;
        }

        function renderAvatar(avatar, label) {
            const image = document.getElementById('avatarImage');
            const initial = document.getElementById('avatarInitial');
            if (avatar) {
                image.src = avatar;
                image.hidden = false;
                initial.textContent = '';
                return;
            }
            image.removeAttribute('src');
            image.hidden = true;
            initial.textContent = (label || '').trim().slice(0, 1).toUpperCase() || '用';
        }

        function previewAvatar(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                const image = document.getElementById('avatarImage');
                document.getElementById('avatarInitial').textContent = '';
                image.src = reader.result;
                image.hidden = false;
                document.getElementById('avatarHint').textContent = '头像仅在当前页面预览，暂未接入保存。';
            };
            reader.readAsDataURL(file);
        }

        function openPasswordModal() {
            passwordForm.reset();
            showPasswordMessage('', '');
            passwordModal.hidden = false;
            document.getElementById('oldPassword').focus();
        }

        function closePasswordModal() {
            passwordModal.hidden = true;
        }

        function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            localStorage.removeItem('authToken');
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            window.location.href = 'login.html';
        }

        function handleUnauthorized() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            window.location.href = 'login.html';
        }

        function getAuthToken() {
            return localStorage.getItem('authToken') || localStorage.getItem('token');
        }

        function showProfileMessage(text, type) {
            profileMessage.textContent = text;
            profileMessage.className = `profile-message ${type || ''}`.trim();
        }

        function showPasswordMessage(text, type) {
            passwordMessage.textContent = text;
            passwordMessage.className = `profile-message ${type || ''}`.trim();
        }

        function normalizeStatus(status) {
            return ({ active: '正常', disabled: '已停用' })[status] || (status || '-');
        }

        function normalizeRole(role) {
            return ({ admin: '管理员', user: '用户' })[role] || (role || '-');
        }
    </script>
</body>
</html>
