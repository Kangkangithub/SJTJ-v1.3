  <text x="90" y="482" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#17302C">text-embedding-v3 批量向量化（BATCH_SIZE=10） · SQLite herb_embeddings 持久化 · 启动增量同步 · 药材增删改实时更新</text>
</g>
