<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F3F6F4"/><g id="header" data-pptx-bounds="60 36 1160 86"><rect x="60" y="40" width="10" height="44" rx="5" fill="#0F5E53"/><text x="88" y="76" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="34" font-weight="bold" fill="#17302C">中医药知识数字化三大痛点</text></g>
