                        <p class="brand-name">神农AI</p>

                    </div>

                <div class="user-entry user-status">

            </div>
            <nav class="nav" aria-label="主导航">
            <div class="nav-inner">
                <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>首页</a>
                <a class="nav-link" href="herb-search.html"><i class="fa-solid fa-magnifying-glass"></i>药材查询</a>
                <a class="nav-link" href="knowledge-graph.html"><i class="fa-solid fa-diagram-project"></i>知识图谱</a>
                <a class="nav-link active" href="qa.html"><i class="fa-solid fa-comments"></i>AI 问答</a>
                <a class="nav-link" href="formula-library.html"><i class="fa-solid fa-book-medical"></i>方剂库</a>
                <a class="nav-link" href="recommendation.html"><i class="fa-solid fa-thumbs-up"></i>方剂推荐</a>

            </div>
            </nav>
        </header>

        <div class="container">
        <main>
            <section class="qa-page-header">
            <div class="qa-title-row">
                <h1><i class="fas fa-comments" aria-hidden="true"></i>AI 问答</h1>
                <a href="knowledge-graph.html" class="btn btn-secondary qa-back-link">
                    <i class="fas fa-arrow-left"></i> 返回知识图谱
                </a>
            </div>
            </section>

            <div class="qa-container">
                <div class="qa-controls" aria-label="AI 问答工具栏">
                    <div class="qa-history-control">
                        <button id="qaHistoryBtn" class="qa-tool-btn" type="button" aria-expanded="false" aria-controls="qaHistoryPanel">历史对话</button>
                        <button id="qaNewChatBtn" class="qa-tool-btn" type="button">新对话</button>
                        <div id="qaHistoryPanel" class="qa-history-panel" hidden></div>
                    </div>
                    <label class="qa-stream-toggle" for="qaStreamToggle">
                        <input id="qaStreamToggle" type="checkbox">
                        <span>流式回答</span>
                    </label>
                    <span id="qaServiceStatus" class="qa-service-status" aria-live="polite"></span>
                </div>
                <div class="chat-window" role="log" aria-live="polite" aria-label="AI 问答对话记录">
                    <div class="message ai-message">
                        <div class="message-avatar"><i class="fas fa-leaf"></i></div>
                        <div class="message-body">
                            <div class="message-content">您好，我是神农AI。您可以咨询药材功效、方剂组成、配伍关系和常见中医药知识。</div>
                            <div class="message-time">--:--</div>
                            <div class="suggestion-chips" aria-label="建议问题">
                                <button class="suggestion-chip" type="button" data-question="人参有什么功效？">人参有什么功效？</button>
                                <button class="suggestion-chip" type="button" data-question="四君子汤的组成与作用是什么？">四君子汤的组成与作用是什么？</button>
                                <button class="suggestion-chip" type="button" data-question="脾胃虚寒怎么调理？">脾胃虚寒怎么调理？</button>
                                <button class="suggestion-chip" type="button" data-question="黄芪和当归如何配伍？">黄芪和当归如何配伍？</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <textarea placeholder="输入中医药问题，例如：人参有什么功效？" id="qaTextarea" aria-label="输入中医药问题"></textarea>
                    <button id="qaSendBtn" type="button">发送</button>
                </div>
            </div>
        </main>
    </div>
        <footer class="footer"><div><strong>神农AI</strong><div>中药药材知识图谱系统</div></div></footer>
    </div>

    <!-- ========== 右侧药材详情面板 ========== -->
    <div id="herbSidePanel" class="herb-side-panel">
        <div class="herb-side-panel-header">
            <h3 id="herbSidePanelTitle"><i class="fas fa-leaf"></i> 药材详情</h3>
            <button class="herb-side-panel-close" onclick="closeHerbPanel()" title="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="herb-side-panel-body" id="herbSidePanelBody">
            <div class="herb-loading"><i class="fas fa-spinner fa-spin"></i> 选择药材查看详情...</div>
        </div>
    </div>
    <div id="herbPanelOverlay" class="herb-panel-overlay" onclick="closeHerbPanel()"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script src="scripts/auth.js"></script>
